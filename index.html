<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Hub - Prawdziwy Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #emulator { border: 4px solid #27272a; border-radius: 16px; background: black; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

<div class="max-w-6xl mx-auto p-6">
    <h1 class="text-4xl font-bold mb-8 flex items-center gap-4">
        <span class="text-blue-500">VM Hub</span> 
        <span class="text-sm bg-zinc-800 px-4 py-2 rounded-full">Prawdziwy Emulator v86</span>
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Lista maszyn -->
        <div class="lg:col-span-1 space-y-4">
            <h2 class="text-2xl font-semibold mb-4">Twoje Maszyny</h2>
            
            <div onclick="loadVM(0)" class="bg-zinc-900 hover:bg-zinc-800 p-5 rounded-3xl cursor-pointer border border-blue-500">
                <h3 class="font-bold">Ubuntu 22.04 Desktop</h3>
                <p class="text-zinc-400 text-sm">Linux • 2 GB RAM • v86</p>
            </div>

            <div onclick="loadVM(1)" class="bg-zinc-900 hover:bg-zinc-800 p-5 rounded-3xl cursor-pointer">
                <h3 class="font-bold">Windows 95</h3>
                <p class="text-zinc-400 text-sm">Retro • v86</p>
            </div>

            <div onclick="loadVM(2)" class="bg-zinc-900 hover:bg-zinc-800 p-5 rounded-3xl cursor-pointer">
                <h3 class="font-bold">Debian Server</h3>
                <p class="text-zinc-400 text-sm">CLI only</p>
            </div>
        </div>

        <!-- Emulator -->
        <div class="lg:col-span-2">
            <div id="emulator-container" class="hidden">
                <div class="flex justify-between mb-3">
                    <h2 id="vm-title" class="text-2xl font-bold"></h2>
                    <button onclick="stopVM()" class="bg-red-600 px-6 py-2 rounded-2xl text-sm font-medium">
                        <i class="fa-solid fa-power-off"></i> Wyłącz
                    </button>
                </div>
                <div id="emulator" style="width:100%; max-width:900px; height:550px;"></div>
            </div>

            <div id="start-screen" class="bg-zinc-900 rounded-3xl p-16 text-center">
                <h2 class="text-3xl font-bold mb-4">Wybierz maszynę z lewej strony</h2>
                <p class="text-zinc-400">Emulator uruchomi się w przeglądarce</p>
            </div>
        </div>
    </div>
</div>

<script src="https://copy.sh/v86/build/v86-all.min.js"></script>
<script>
    let emulator = null;

    const vms = [
        {
            name: "Ubuntu 22.04",
            config: {
                wasm_path: "https://copy.sh/v86/build/",
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 32 * 1024 * 1024,
                bzimage: "https://copy.sh/v86/bzimage",
                filesystem: { "url": "https://copy.sh/v86/images/ubuntu-22.04-fs.json" }
            }
        },
        {
            name: "Windows 95",
            config: {
                wasm_path: "https://copy.sh/v86/build/",
                memory_size: 128 * 1024 * 1024,
                filesystem: { "url": "https://copy.sh/v86/images/win95.json" }
            }
        }
    ];

    function loadVM(index) {
        const vm = vms[index];
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('emulator-container').classList.remove('hidden');
        document.getElementById('vm-title').textContent = vm.name;

        if (emulator) emulator.destroy();

        emulator = new V86Starter({
            screen_container: document.getElementById("emulator"),
            ...vm.config
        });

        emulator.add_listener("emulator-loaded", () => {
            console.log("Emulator uruchomiony");
        });
    }

    function stopVM() {
        if (emulator) {
            emulator.destroy();
            emulator = null;
        }
        document.getElementById('emulator-container').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
