<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Hub • Twój Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .vm-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-zinc-900 border-r border-zinc-800 p-6 flex flex-col">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-2xl font-bold">V</div>
                <h1 class="text-3xl font-bold">VM Hub</h1>
            </div>
            
            <button onclick="showAddModal()" 
                    class="w-full bg-white text-black font-bold py-5 rounded-3xl flex items-center justify-center gap-3 hover:bg-white/90">
                <i class="fa-solid fa-plus"></i>
                <span>DODAJ NOWĄ MASZYNĘ WIRTUALNĄ</span>
            </button>
        </div>

        <!-- Główna zawartość -->
        <div class="flex-1 p-8">
            <h2 class="text-4xl font-bold mb-8">Twoje Maszyny Wirtualne</h2>
            
            <div id="vm-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Maszyny będą dodawane tutaj -->
            </div>
        </div>
    </div>

    <!-- Modal dodawania -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
        <div class="bg-zinc-900 w-full max-w-md rounded-3xl p-8">
            <h3 class="text-2xl font-bold mb-6">Nowa Maszyna Wirtualna</h3>
            
            <input id="name" type="text" placeholder="Nazwa maszyny" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
            
            <select id="type" class="w-full bg-zinc-800 p-4 rounded-2xl mb-6">
                <option value="virtualbox">VirtualBox</option>
                <option value="hyperv">Hyper-V</option>
                <option value="vmware">VMware</option>
            </select>
            
            <div class="flex gap-4">
                <button onclick="hideModal()" class="flex-1 py-4 border border-zinc-700 rounded-3xl">Anuluj</button>
                <button onclick="addVM()" class="flex-1 py-4 bg-blue-600 rounded-3xl font-bold">Dodaj maszynę</button>
            </div>
        </div>
    </div>

    <script>
        let vms = [];

        function render() {
            const container = document.getElementById('vm-list');
            container.innerHTML = vms.map(vm => `
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-6">
                    <div class="flex justify-between">
                        <h3 class="text-xl font-semibold">${vm.name}</h3>
                        <span class="text-xs px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full">${vm.type.toUpperCase()}</span>
                    </div>
                    <p class="text-zinc-500 mt-4">Gotowa do użycia</p>
                    <div class="mt-6 flex gap-3">
                        <button onclick="alert('Połączono z ${vm.name}')" 
                                class="flex-1 bg-white text-black py-3 rounded-2xl font-medium">Połącz</button>
                        <button onclick="alert('Współdzielenie włączone dla ${vm.name}')" 
                                class="flex-1 border border-zinc-600 py-3 rounded-2xl">Udostępnij</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function addVM() {
            const name = document.getElementById('name').value || "Nowa Maszyna";
            const type = document.getElementById('type').value;
            
            vms.push({name, type});
            render();
            hideModal();
            
            document.getElementById('name').value = '';
        }

        // Start
        window.onload = () => {
            vms = [
                {name: "Serwer Minecraft", type: "virtualbox"},
                {name: "Windows Test", type: "hyperv"}
            ];
            render();
        };
    </script>
</body>
</html>
