<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Hub - Prawdziwy Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        #screen { background: #000; border: 8px solid #18181b; border-radius: 12px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-5xl font-bold tracking-tight">VM Hub <span class="text-blue-500 text-2xl">• Prawdziwy Emulator</span></h1>
        <div class="text-sm text-zinc-500">Prezentacja gotowa</div>
    </div>

    <div class="grid grid-cols-12 gap-6">
        <!-- Lista VM -->
        <div class="col-span-12 lg:col-span-3 space-y-4">
            <h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-server"></i> Dostępne maszyny</h2>
            
            <div onclick="startEmulator(0)" class="vm-card bg-zinc-900 hover:bg-zinc-800 p-6 rounded-3xl cursor-pointer border border-blue-600">
                <h3 class="font-bold text-lg">Ubuntu 22.04 Desktop</h3>
                <p class="text-emerald-400 text-sm">Linux • Graficzny • v86</p>
            </div>

            <div onclick="startEmulator(1)" class="vm-card bg-zinc-900 hover:bg-zinc-800 p-6 rounded-3xl cursor-pointer">
                <h3 class="font-bold text-lg">Windows 98</h3>
                <p class="text-amber-400 text-sm">Retro • Klasyczny</p>
            </div>

            <div onclick="startEmulator(2)" class="vm-card bg-zinc-900 hover:bg-zinc-800 p-6 rounded-3xl cursor-pointer">
                <h3 class="font-bold text-lg">JSLinux Terminal</h3>
                <p class="text-zinc-400 text-sm">Szybki Linux (terminal)</p>
            </div>
        </div>

        <!-- Emulator Area -->
        <div class="col-span-12 lg:col-span-9">
            <div id="vm-header" class="hidden flex justify-between items-center mb-4">
                <h2 id="vm-name" class="text-3xl font-bold"></h2>
                <button onclick="stopEmulator()" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-2xl font-medium">
                    <i class="fa-solid fa-power-off"></i> Wyłącz VM
                </button>
            </div>

            <div id="emulator-area" class="hidden">
                <iframe id="emulator-frame" width="100%" height="620" class="rounded-3xl" allowfullscreen></iframe>
            </div>

            <div id="welcome" class="bg-zinc-900 rounded-3xl p-20 text-center">
                <h2 class="text-4xl font-bold mb-4">Wybierz maszynę z lewej strony</h2>
                <p class="text-zinc-400 max-w-md mx-auto">Uruchomi się prawdziwy emulator x86 w przeglądarce (v86 / JSLinux)</p>
            </div>
        </div>
    </div>
</div>

<script>
function startEmulator(id) {
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('emulator-area').classList.remove('hidden');
    document.getElementById('vm-header').classList.remove('hidden');

    const frame = document.getElementById('emulator-frame');
    const name = document.getElementById('vm-name');

    if (id === 0) {
        name.textContent = "Ubuntu 22.04 (v86)";
        frame.src = "https://copy.sh/v86/?profile=ubuntu";
    } else if (id === 1) {
        name.textContent = "Windows 98 (v86)";
        frame.src = "https://copy.sh/v86/?profile=win98";
    } else if (id === 2) {
        name.textContent = "JSLinux Terminal";
        frame.src = "https://bellard.org/jslinux/vm.html?url=alpine-x86.cfg";
    }
}

function stopEmulator() {
    const frame = document.getElementById('emulator-frame');
    frame.src = "";
    document.getElementById('emulator-area').classList.add('hidden');
    document.getElementById('vm-header').classList.add('hidden');
    document.getElementById('welcome').classList.remove('hidden');
}
</script>

</body>
</html>
